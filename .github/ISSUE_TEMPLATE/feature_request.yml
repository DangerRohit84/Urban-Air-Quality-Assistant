name: Feature request
description: Propose a capability or improvement.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operator problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behaviour, API or UI you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, including doing nothing.
  - type: checkboxes
    id: constraints
    attributes:
      label: Project constraints
      options:
        - label: Works offline with no provider keys
          required: true
        - label: Keeps backend modules under 150 lines
          required: true
        - label: Includes a test plan
          required: true
