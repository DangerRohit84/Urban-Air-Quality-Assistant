# Project configuration for the Urban Air Quality Assistant.
#
# Every gate quoted in README.md is enforced from this file by
# scripts/check_quality.py:
#   - ruff     : lint rules
#   - mypy     : type checking
#   - pytest   : test discovery + zero-warning policy
#   - coverage : the TOTAL >= 89% floor

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urban-air-quality-assistant"
version = "0.1.0"
description = "Personalized low-emission routines, indoor air hacks and grounded answers from CPCB AQI context."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Rohit" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "pypdf>=4.0",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "pip-audit>=2.7",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
backend = ["data/*.json"]

# --------------------------------------------------------------------------
# pytest
# --------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
python_files = ["test_*.py"]
# The first entry keeps every warning fatal. The second targets exactly one
# third-party warning - starlette's TestClient httpx deprecation - by message
# and class; there is no blanket DeprecationWarning/Warning suppression.
filterwarnings = [
    "error",
    "ignore:Using `httpx` with `starlette\\.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

# --------------------------------------------------------------------------
# coverage - the enforced floor quoted in README.md
# --------------------------------------------------------------------------

[tool.coverage.run]
source = ["backend"]
branch = true
omit = ["*/__pycache__/*", "*/tests/*"]

[tool.coverage.report]
fail_under = 89
show_missing = true
skip_covered = false
omit = ["*/__pycache__/*", "tests/*"]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# --------------------------------------------------------------------------
# ruff - the lint gate
# --------------------------------------------------------------------------

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["backend", "tests"]
extend-exclude = [".venv", "node_modules"]

[tool.ruff.lint]
select = [
    "E4",    # pycodestyle - imports
    "E7",    # pycodestyle - statements
    "E9",    # pycodestyle - runtime errors
    "W",     # pycodestyle - warnings
    "F",     # pyflakes
    "I",     # isort
    "C4",    # flake8-comprehensions
    "RET",   # flake8-return
    "SIM",   # flake8-simplify
    "PIE",   # flake8-pie
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "BLE",   # flake8-blind-except
    "S",     # flake8-bandit
    "D418",  # pydocstyle - overloaded function must carry a docstring
]
ignore = [
    "E501",    # line length is handled by the formatter, not the linter
    "S101",    # assert - the point of a test suite
    "PLR2004", # magic values are used deliberately in domain tables
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

# --------------------------------------------------------------------------
# mypy - the type gate
# --------------------------------------------------------------------------

[tool.mypy]
python_version = "3.11"
files = ["backend/app"]
# The google.*/openai.* override below is forward-looking: those providers are
# imported lazily by later tasks, so unused-section notes are suppressed.
warn_unused_configs = false
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
strict_equality = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = false
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "pypdf.*", "google.*", "openai.*"]
ignore_missing_imports = true
